# ~40M-parameter dense decoder-only Transformer; small enough to pretrain
# on a laptop/CPU for the "small-scale proof" roadmap phase, and a
# drop-in stand-in for the Explore/Agent sandbox in this repo's tests.
vocab_size: 32768
dim: 512
n_layers: 8
n_heads: 8
n_kv_heads: 2      # GQA: 4 query heads share each KV head
mlp_ratio: 3.5
mult_of: 32
max_seq_len: 1024
rope_theta: 10000.0
norm_eps: 1.0e-5
dropout: 0.0
tie_embeddings: true
bias: false
