# Data pipeline settings (see data/filters.py, dedup.py, lang_id.py, pii.py).
filters:
  min_words_per_line: 3
  min_avg_word_len: 2.0
  max_punct_run: 4
  max_symbol_ratio: 0.3
  min_kept_line_ratio: 0.3   # drop a whole doc if filtering removes more than this share of its lines

lang_id:
  target_languages: ["en", "bn"]
  min_confidence: 0.5

dedup:
  shingle_size: 5
  num_perm: 64
  bands: 16
  jaccard_threshold: 0.8

tokenizer:
  vocab_size: 32768
  special_tokens: ["<pad>", "<bos>", "<eos>", "<unk>"]

sharding:
  shard_tokens: 10_000_000
