model:
  vocab_size: 32768
  dim: 512
  n_layers: 8
  n_heads: 8
  n_kv_heads: 2
  mlp_ratio: 3.5
  mult_of: 32
  max_seq_len: 1024
  rope_theta: 10000.0
  tie_embeddings: true
  bias: false

data:
  shard_dir: shards/train

train:
  micro_batch_size: 8
  grad_accum_steps: 4
  total_steps: 20000
  warmup_steps: 500
  max_lr: 3.0e-4
  min_lr: 3.0e-5
  weight_decay: 0.1
  betas: [0.9, 0.95]
  grad_clip: 1.0
  dtype: bf16          # falls back to fp32 automatically on CPU
  num_workers: 2
  log_every: 10
  ckpt_every: 1000
  ckpt_dir: checkpoints/pretrain

seed: 1337
